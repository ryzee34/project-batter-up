[project]
name = "batter-up"
version = "0.1.0"
description = "data pipeline and pitch model for project batter up"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
batter-up = "batter_up.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batter_up"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
